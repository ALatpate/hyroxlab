# Luma development loop. Runs on every push to a luma-* branch (never on main, so nothing is released):
#   core     LumaCore unit tests on Linux (minutes).
#   gallery  Builds the LumaGallery host (LumaUI + demo data only) for the simulator and photographs
#            every screen in Tools/luma_screens.txt; the images land on the orphan `screens` branch.
#   app      The full app (Debug, simulator). Slow, so it only runs when the commit message contains
#            [app]. Its screenshots land on `screens-app`.
#   package  A dry run of the release: the same Release device build and sideload packaging a push to
#            main performs, publishing nothing. Runs with `app`.
#   gallery-intel  The gallery on an Intel runner, for when no arm64 macOS runner is to be had. Runs
#            when the commit message contains [intel]; pictures land on `screens-intel`.
# `app` and `package` can also be built on the Intel runner: put [app-intel] in the commit message in
# place of [app]. The Intel image's default Xcode is too old for the app, so they first select the
# Xcode 26 it also carries (Tools/luma_xcode.sh).
name: Luma dev

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'macOS jobs to run: any of gallery, intel, app, package'
        default: 'gallery app package'
      attempt:
        description: 'How many times this has been asked for already (set by the workflow itself)'
        default: '0'
      runner:
        description: 'Runner for app and package: macos-26 or macos-15-intel'
        default: 'macos-26'
  push:
    branches: ['luma-*']

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v5
      - name: swift test
        working-directory: Packages/LumaCore
        shell: bash
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | grep -E "error|warning: var|Compiling|Build complete" | grep -v "^\[" | sort -u | head -150 || true
          swift test 2>&1 | grep -vE "^Test Case .* (started|passed)|^Test Suite .* (started|passed)|Compiling|Build complete|^\[" | tail -80

  gallery:
    if: github.event_name == 'push' || (contains(inputs.jobs, 'gallery') && contains(fromJSON('["0","1"]'), inputs.attempt))
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build LumaGallery (Debug, simulator)
        run: |
          set -o pipefail
          (cd LumaGallery && xcodegen generate)
          if ! xcodebuild -project LumaGallery/LumaGallery.xcodeproj -scheme LumaGallery -configuration Debug \
               -destination 'generic/platform=iOS Simulator' -derivedDataPath build/gallery \
               ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build > build.log 2>&1; then
            echo "=== COMPILE ERRORS ($(grep -cE ': error:' build.log)) ==="
            grep -E ": error:" build.log | sed -E 's#^.*/Packages/##; s#^.*/LumaGallery/##' | awk '!seen[$0]++' | head -300
            echo "=== LAST LINES ==="
            tail -25 build.log
            exit 1
          fi
          echo "build ok"
          grep -E "\.swift:[0-9]+:[0-9]+: warning:" build.log | sed -E 's#^.*/Packages/##' | awk '!seen[$0]++' | head -40 || true
      - name: Capture screens
        run: Tools/luma_screens.sh build/gallery/Build/Products/Debug-iphonesimulator/LumaGallery.app shots Tools/luma_screens.txt
      - name: Publish to the screens branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd shots
          echo "${GITHUB_SHA}" > COMMIT
          git init -q
          git checkout -q -b screens
          git add -A
          git -c user.name=luma-ci -c user.email=luma-ci@users.noreply.github.com commit -qm "screens for ${GITHUB_SHA:0:7}"
          # The runner has lost its name lookup for a moment before now; the pictures are not thrown
          # away for that.
          for try in 1 2 3 4 5; do
            if git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screens; then break; fi
            if [ "$try" = 5 ]; then echo "::error::could not push the pictures"; exit 1; fi
            sleep 20
          done
          ls | head -100

  # The gallery again, on an Intel runner with the previous Xcode: for the days GitHub has no arm64
  # macOS runner to give (a queued job is then cancelled after fifteen minutes). LumaUI uses nothing
  # newer than iOS 18, so it builds there too; the simulator is an iOS 18 one, so system chrome can
  # look a little different. Runs only when the commit message contains [intel]; its pictures land on
  # the `screens-intel` branch and never replace the `screens` ones.
  gallery-intel:
    if: contains(github.event.head_commit.message, '[intel]') || (github.event_name == 'workflow_dispatch' && contains(inputs.jobs, 'intel') && contains(fromJSON('["0","1"]'), inputs.attempt))
    runs-on: macos-15-intel
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build LumaGallery (Debug, simulator, x86_64)
        run: |
          set -o pipefail
          xcodebuild -version
          (cd LumaGallery && xcodegen generate)
          if ! xcodebuild -project LumaGallery/LumaGallery.xcodeproj -scheme LumaGallery -configuration Debug \
               -destination 'generic/platform=iOS Simulator' -derivedDataPath build/gallery \
               ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build > build.log 2>&1; then
            echo "=== COMPILE ERRORS ($(grep -cE ': error:' build.log)) ==="
            grep -E ": error:" build.log | sed -E 's#^.*/Packages/##; s#^.*/LumaGallery/##' | awk '!seen[$0]++' | head -300
            echo "=== LAST LINES ==="
            tail -25 build.log
            exit 1
          fi
          echo "build ok"
      - name: Capture screens
        run: Tools/luma_screens.sh build/gallery/Build/Products/Debug-iphonesimulator/LumaGallery.app shots Tools/luma_screens.txt
      - name: Publish to the screens-intel branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd shots
          echo "${GITHUB_SHA}" > COMMIT
          git init -q
          git checkout -q -b screens-intel
          git add -A
          git -c user.name=luma-ci -c user.email=luma-ci@users.noreply.github.com commit -qm "screens (intel) for ${GITHUB_SHA:0:7}"
          # The runner has lost its name lookup for a moment before now; the pictures are not thrown
          # away for that.
          for try in 1 2 3 4 5; do
            if git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screens-intel; then break; fi
            if [ "$try" = 5 ]; then echo "::error::could not push the pictures"; exit 1; fi
            sleep 20
          done
          ls | head -100

  app:
    if: contains(github.event.head_commit.message, '[app]') || contains(github.event.head_commit.message, '[app-intel]') || (github.event_name == 'workflow_dispatch' && contains(inputs.jobs, 'app') && contains(fromJSON('["0","1"]'), inputs.attempt))
    runs-on: ${{ (contains(github.event.head_commit.message, '[app-intel]') || inputs.runner == 'macos-15-intel') && 'macos-15-intel' || 'macos-26' }}
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5
      - name: Use Xcode 26 where it is not the default
        run: Tools/luma_xcode.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build NOOPiOS (Debug, simulator)
        run: |
          set -o pipefail
          xcodebuild -version
          if ! xcodebuild -scheme NOOPiOS -configuration Debug -destination 'generic/platform=iOS Simulator' \
               -derivedDataPath build/dd ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=NO \
               CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > build.log 2>&1; then
            echo "=== COMPILE ERRORS ($(grep -cE ': error:' build.log)) ==="
            grep -E ": error:" build.log | sed -E 's#^.*/hyroxlab/hyroxlab/##' | awk '!seen[$0]++' | head -300
            echo "=== LAST LINES ==="
            tail -30 build.log
            exit 1
          fi
          echo "build ok"
      - name: Capture screens
        run: |
          # Where another Xcode was selected for the build, the simulators are the ones that came with
          # the runner's own default, so the pictures are taken with that one.
          if [ -n "${LUMA_DEFAULT_XCODE:-}" ] && [ "$(xcode-select -p)" != "$LUMA_DEFAULT_XCODE" ]; then
            sudo xcode-select -s "$LUMA_DEFAULT_XCODE"
            echo "simulators from: $(xcodebuild -version | tr '\n' ' ')"
          fi
          Tools/luma_screens.sh build/dd/Build/Products/Debug-iphonesimulator/NOOP.app shots Tools/luma_screens_app.txt --demo-seed
      - name: Publish to the screens-app branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd shots
          echo "${GITHUB_SHA}" > COMMIT
          git init -q
          git checkout -q -b screens-app
          git add -A
          git -c user.name=luma-ci -c user.email=luma-ci@users.noreply.github.com commit -qm "app screens for ${GITHUB_SHA:0:7}"
          # The runner has lost its name lookup for a moment before now; the pictures are not thrown
          # away for that.
          for try in 1 2 3 4 5; do
            if git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screens-app; then break; fi
            if [ "$try" = 5 ]; then echo "::error::could not push the pictures"; exit 1; fi
            sleep 20
          done
          ls | head -60

  package:
    if: contains(github.event.head_commit.message, '[app]') || contains(github.event.head_commit.message, '[app-intel]') || (github.event_name == 'workflow_dispatch' && contains(inputs.jobs, 'package') && contains(fromJSON('["0","1"]'), inputs.attempt))
    runs-on: ${{ (contains(github.event.head_commit.message, '[app-intel]') || inputs.runner == 'macos-15-intel') && 'macos-15-intel' || 'macos-26' }}
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5
      - name: Use Xcode 26 where it is not the default
        run: Tools/luma_xcode.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build NOOPiOS (device, unsigned, Release)
        run: |
          set -o pipefail
          xcodebuild -version
          if ! xcodebuild -scheme NOOPiOS -configuration Release -destination 'generic/platform=iOS' \
               -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
               CURRENT_PROJECT_VERSION=1 build > build.log 2>&1; then
            echo "=== COMPILE ERRORS ($(grep -cE ': error:' build.log)) ==="
            grep -E ": error:" build.log | sed -E 's#^.*/hyroxlab/hyroxlab/##' | awk '!seen[$0]++' | head -300
            echo "=== LAST LINES ==="
            tail -30 build.log
            exit 1
          fi
          echo "build ok"
      - name: Package for sideloading and inspect the bundle
        run: |
          set -euo pipefail
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo "::error::.app (iphoneos) not found"; exit 1; }
          rm -rf "$APP/Watch"
          test -d "$APP/PlugIns/NOOPWidgets.appex" || { echo "::error::widget extension missing"; exit 1; }
          Tools/prepare-ios-sideload-app.sh "$APP"
          P=/usr/libexec/PlistBuddy
          W="$APP/PlugIns/NOOPWidgets.appex"
          echo "app name:          $($P -c 'Print :CFBundleDisplayName' "$APP/Info.plist")"
          echo "widget name:       $($P -c 'Print :CFBundleDisplayName' "$W/Info.plist")"
          echo "frequent updates:  $($P -c 'Print :NSSupportsLiveActivitiesFrequentUpdates' "$APP/Info.plist")"
          echo "camera text:       $($P -c 'Print :NSCameraUsageDescription' "$APP/Info.plist")"
          echo "alternate icons:   $($P -c 'Print :CFBundleIcons:CFBundleAlternateIcons' "$APP/Info.plist" 2>/dev/null || echo none)"
          echo "--- sentences in either Info.plist that still carry the earlier name"
          for f in "$APP/Info.plist" "$W/Info.plist"; do
            plutil -convert xml1 -o - "$f" | grep -E "<string>[^<]* [^<]*NOOP|NOOP [^<]*</string>" || echo "none in $(basename "$(dirname "$f")")"
          done
          # The typeface ships as a package resource bundle. The app must hold it; the widget extension
          # reads its own copy or, failing that, the app's (LumaType.fontFiles).
          echo "--- font bundles"
          find "$APP" -maxdepth 3 -name 'LumaUI_LumaKit.bundle' | sed "s#^$APP#app#" || true
          FONTS=$(find "$APP" -path '*LumaUI_LumaKit.bundle*' -name 'BarlowCondensed-*.ttf' | wc -l | tr -d ' ')
          echo "font files: $FONTS"
          test "$FONTS" -ge 4 || { echo "::error::the Barlow Condensed fonts are not in the app bundle"; exit 1; }
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qr dry-run.ipa Payload
          echo "ipa size: $(stat -f%z dry-run.ipa) bytes"

  # GitHub is at times short of macOS runners. A job no runner takes within fifteen minutes is
  # cancelled ("The job was not acquired by Runner of type hosted"), with nothing built. This asks
  # for those jobs again, once, as a new run of this workflow on the same branch, on the other kind
  # of runner from the one that did not come. Once only: on the day both kinds were short, runs that
  # kept asking stood in the queue beside the release build, and a run cannot be cancelled from where
  # the work is done. A run asked for a second time builds nothing (the conditions on the jobs
  # above). A job cancelled for any other reason (by hand, or by a newer push) is left alone.
  again:
    needs: [gallery, gallery-intel, app, package]
    # After every run, whatever became of its jobs. The result this job is handed for a job no
    # runner took is "abandoned", not "cancelled" or "failure" (a condition written on those two
    # skipped this job twice), while the list of jobs calls the same job cancelled. So it reads the
    # list itself and goes by that and by the cancelled job's own note.
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      checks: read
    steps:
      - name: Ask again for the jobs no runner took
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ inputs.attempt || '0' }}
          NEEDS: ${{ toJSON(needs) }}
          ASKED: ${{ (contains(github.event.head_commit.message, '[app-intel]') || inputs.runner == 'macos-15-intel') && 'macos-15-intel' || 'macos-26' }}
        run: |
          set -euo pipefail
          echo "results as handed to this job: $(echo "$NEEDS" | tr -d ' \n' | cut -c1-600)"
          jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=50" \
                   -q '.jobs[] | [.name, (.conclusion // "-"), (.id|tostring)] | @tsv')
          echo "the list of jobs:"; echo "$jobs"
          # Each reads its whole input and matches in the shell: with pipefail on, a reader that stops
          # early can fail the pipe that feeds it, and a match would then read as none.
          field() { awk -F'\t' -v n="$1" -v c="$2" '$1==n && !seen {print $c; seen=1}' <<< "$jobs"; }
          how() { field "$1" 2; }
          # The note that says why a job was cancelled can arrive a little after the job ends.
          unclaimed() {
            for try in 1 2 3 4 5 6; do
              notes=$(gh api "repos/${GITHUB_REPOSITORY}/check-runs/$1/annotations" -q '.[].message' || true)
              case "$notes" in *"not acquired by Runner"*) return 0;; esac
              sleep 10
            done
            return 1
          }
          # One set of pictures is enough: when either gallery made it, neither is asked for again.
          pictures=no
          if [ "$(how gallery)" = "success" ] || [ "$(how gallery-intel)" = "success" ]; then pictures=yes; fi
          # Each job, and what to ask for when no runner took it. A gallery is asked for on the other
          # kind of runner, as the app and the package are below: asking the same kind again has been
          # seen to wait through eight more quarters of an hour.
          want=""
          for pair in gallery:intel gallery-intel:gallery app:app package:package; do
            job=${pair%%:*}; token=${pair##*:}
            if [ "$(how "$job")" != "cancelled" ]; then continue; fi
            case "$job" in gallery*) if [ "$pictures" = yes ]; then continue; fi;; esac
            id=$(field "$job" 3)
            if unclaimed "$id"; then want="$want $token"; fi
          done
          want=$(echo $want)
          if [ -z "$want" ]; then echo "nothing to ask for again"; exit 0; fi
          n=$((ATTEMPT + 1))
          if [ "$n" -gt 1 ]; then echo "::warning::no macOS runner of either kind for: $want; not asking a second time"; exit 0; fi
          if [ "$ASKED" = "macos-26" ]; then other=macos-15-intel; else other=macos-26; fi
          echo "attempt $n for: $want (app and package on $other)"
          gh workflow run "Luma dev" --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}" -f attempt="$n" -f jobs="$want" -f runner="$other"
