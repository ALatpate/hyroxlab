# HYROXCore is Foundation-only, so its tests run on a Linux runner in a few minutes — the fast
# feedback loop for the maths, independent of the 20-minute iOS build.
name: HYROXCore tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'Packages/HYROXCore/**'
      - '.github/workflows/hyroxcore-tests.yml'
  pull_request:
    paths:
      - 'Packages/HYROXCore/**'

jobs:
  test:
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v5
      - name: swift test
        working-directory: Packages/HYROXCore
        shell: bash
        run: set -o pipefail; swift test 2>&1 | tail -120
