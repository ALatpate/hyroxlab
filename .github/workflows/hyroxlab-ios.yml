# Luma — iOS build + over-the-air distribution.
#
# Every push to main (and any manual dispatch) builds the NOOPiOS target unsigned on macOS 26,
# packages it for sideloading, publishes it as its OWN GitHub release (`build-<run number>`), and
# rewrites hyroxlab-source.json so AltStore / SideStore on the phone sees a new build and offers the
# update. No secrets, no signing: the sideloader re-signs on the phone.
#
# Why one release per build, never a rolling one. The listing AltStore holds names one build and one
# file, and AltStore refuses a download whose build number is not the listed one. With a single
# rolling `latest` file, a phone that had not refreshed since the previous build downloaded the newer
# file under the older listing and the update failed ("does not match the build number specified by
# the source"). A build's file is therefore never replaced by another build's, and the listing is
# written only after the file it names is published and checked.
#
# The workflow's name and file name must not change: the run number is the build number, and a
# renamed workflow starts counting from 1 again, below every build already installed.
#
# When a paid Apple Developer account is in place, a sibling workflow signs the same build and
# uploads it to TestFlight; this one stays as the fallback.
name: HYROX Lab iOS

on:
  workflow_dispatch:
    inputs:
      attempt:
        description: 'How many times this build has been asked for already (set by the workflow itself)'
        default: '0'
      runner:
        description: 'Runner to build on: macos-26, or macos-15-intel when no arm64 runner is to be had'
        default: 'macos-26'
      avoid:
        description: 'A runner whose build failed for a reason of its own, not to be gone back to (set by the workflow itself)'
        default: ''
  push:
    branches: [main]
    paths:
      - 'Strand/**'
      - 'StrandiOS/**'
      - 'StrandiOSShared/**'
      - 'StrandiOSWidgets/**'
      - 'Packages/**'
      - 'Config/**'
      - 'project.yml'
      - '.github/workflows/hyroxlab-ios.yml'

permissions:
  contents: write

concurrency:
  group: hyroxlab-ios
  cancel-in-progress: true

jobs:
  ios:
    # A push builds on the arm64 runner. When none is to be had, the job at the end of this file asks
    # for the build again on the Intel runner, which is slower and needs the step below.
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5

      # Changes nothing where Xcode 26 is the default. The Intel image defaults to an older Xcode and
      # carries Xcode 26 beside it.
      - name: Use Xcode 26 where it is not the default
        run: Tools/luma_xcode.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build NOOPiOS (device, unsigned, Release)
        run: >-
          xcodebuild -scheme NOOPiOS -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          build

      - name: Package sideload .ipa
        id: pkg
        run: |
          set -euo pipefail
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo "::error::.app (iphoneos) not found"; exit 1; }
          rm -rf "$APP/Watch"
          test -d "$APP/PlugIns/NOOPWidgets.appex" || { echo "::error::widget extension missing"; exit 1; }
          Tools/prepare-ios-sideload-app.sh "$APP"
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          test "$BUILD" = "${GITHUB_RUN_NUMBER}" || { echo "::error::CFBundleVersion $BUILD != run number ${GITHUB_RUN_NUMBER}"; exit 1; }
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qr Luma.ipa Payload
          SIZE=$(stat -f%z Luma.ipa)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "bid=$BID" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "built $BID $VER ($SIZE bytes)"

      # The earlier rolling `latest` release is left exactly as it is: the last listing that pointed
      # at it is still on phones that have not refreshed, and it keeps working for them.
      - name: Publish this build as its own release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.pkg.outputs.ver }}
          SIZE: ${{ steps.pkg.outputs.size }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          SHA="${GITHUB_SHA:0:7}"
          DATE=$(date -u +%Y-%m-%d)
          # Only a re-run of this same run number can find its tag taken; no other build's is touched.
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Luma iOS — ${VER} build ${GITHUB_RUN_NUMBER} · ${DATE} · ${SHA}" \
            --notes "Luma for iPhone, build ${GITHUB_RUN_NUMBER} (unsigned; AltStore / SideStore re-sign on install). Bundle id \`${{ steps.pkg.outputs.bid }}\`, version ${VER}, commit \`${SHA}\`. Built on the open-source NOOP project under the PolyForm Noncommercial licence." \
            Luma.ipa
          # The listing is written only once the file it will name is there and is this build's file.
          PUBLISHED=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" -q '.assets[] | select(.name=="Luma.ipa") | .size')
          test "$PUBLISHED" = "$SIZE" || { echo "::error::published file is ${PUBLISHED:-missing} bytes, built ${SIZE}"; exit 1; }
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Luma.ipa" >> "$GITHUB_OUTPUT"

      - name: Rewrite hyroxlab-source.json (AltStore / SideStore source)
        env:
          VER: ${{ steps.pkg.outputs.ver }}
          BID: ${{ steps.pkg.outputs.bid }}
          SIZE: ${{ steps.pkg.outputs.size }}
          URL: ${{ steps.rel.outputs.url }}
        run: |
          set -euo pipefail
          python3 Tools/hyroxlab_source.py \
            --repo "$GITHUB_REPOSITORY" --version "$VER" --build "$GITHUB_RUN_NUMBER" \
            --bundle-id "$BID" --size "$SIZE" --sha "${GITHUB_SHA:0:7}" \
            --download-url "$URL" --notes-file docs/luma-whats-new.txt \
            --out hyroxlab-source.json
          git config user.name "hyroxlab-ci"
          git config user.email "hyroxlab-ci@users.noreply.github.com"
          git add hyroxlab-source.json
          if git diff --cached --quiet; then echo "source unchanged"; exit 0; fi
          git commit -m "ci: hyroxlab-source.json → build ${GITHUB_RUN_NUMBER} [skip ci]"
          git push origin HEAD:main

      # After the new listing is live. Six builds is far more than a listing can lag by; a phone holding
      # an older one than that sees a failed download and a refresh fixes it.
      - name: Keep the six newest builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OLD=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" -q '.[].tag_name' \
                  | { grep -E '^build-[0-9]+$' || true; } | sort -t- -k2,2nr | tail -n +7)
          for tag in $OLD; do
            echo "removing $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          done

  # GitHub is at times short of macOS runners. A job no runner takes within fifteen minutes is
  # cancelled ("The job was not acquired by Runner of type hosted"), with nothing built or published.
  # This asks for the build again, as a new run, up to twelve times, on the other kind of runner each
  # time (arm64, then Intel, then arm64). Each asking is a new run number, so the build number moves
  # on; a number that never built is simply skipped. A build that failed on the Intel runner for a
  # reason of its own is asked for once more on arm64, and Intel is not gone back to. A build that
  # failed on arm64, or was cancelled for any other reason (by hand, or by a newer push taking its
  # place), is left alone.
  again:
    needs: [ios]
    # After every run, whatever became of the build. The result this job is handed for the build does
    # not say "cancelled" for a job no runner took (a condition written on it skipped the same job in
    # the development workflow twice), so it reads the list of jobs itself and goes by that.
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      checks: read
    steps:
      - name: Ask for the build again when no runner took it
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ inputs.attempt || '0' }}
          ASKED: ${{ inputs.runner || 'macos-26' }}
          AVOID: ${{ inputs.avoid || '' }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "result as handed to this job: $(echo "$NEEDS" | tr -d ' \n' | cut -c1-300)"
          line=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
                   -q '[.jobs[] | select(.name=="ios")][0] | [(.conclusion // "-"), (.id|tostring)] | @tsv' || true)
          how=$(cut -f1 <<< "$line"); id=$(cut -f2 <<< "$line")
          echo "the build in the list of jobs: ${how:-not found}, asked for on $ASKED"
          if [ "$ASKED" = "macos-26" ]; then other=macos-15-intel; else other=macos-26; fi
          next=""; avoid="$AVOID"
          if [ "$how" = "cancelled" ] && [ -n "$id" ]; then
            # The note that says why the job was cancelled can arrive a little after the job ends.
            # Matched in the shell: with pipefail on, a reader that stops early can fail the pipe that
            # feeds it, and a match would then read as none.
            for try in 1 2 3 4 5 6; do
              notes=$(gh api "repos/${GITHUB_REPOSITORY}/check-runs/${id}/annotations" -q '.[].message' || true)
              case "$notes" in *"not acquired by Runner"*) next="$other"; break;; esac
              sleep 10
            done
            if [ -z "$next" ]; then echo "the build was not cancelled for want of a runner; not asking again"; exit 0; fi
            if [ "$next" = "$avoid" ]; then next="$ASKED"; fi
          elif [ "$how" = "failure" ] && [ "$ASKED" = "macos-15-intel" ]; then
            echo "the build failed on the Intel runner; asking once more on arm64 and not going back"
            next=macos-26; avoid=macos-15-intel
          else
            echo "nothing to ask for again"; exit 0
          fi
          n=$((ATTEMPT + 1))
          if [ "$n" -gt 12 ]; then echo "::warning::no build after 12 attempts"; exit 0; fi
          echo "attempt $n, on $next"
          gh workflow run "HYROX Lab iOS" --repo "${GITHUB_REPOSITORY}" --ref main -f attempt="$n" -f runner="$next" -f avoid="$avoid"
