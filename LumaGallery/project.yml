# Development-only host for LumaUI. It links the Luma interface with demo data and nothing else, so a
# simulator build takes minutes and Tools/luma_screens.sh can photograph every screen. Never shipped.
name: LumaGallery
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  LumaUI:
    path: ../Packages/LumaUI
targets:
  LumaGallery:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: LumaUI
        product: LumaUI
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Luma
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Shows where you are during a run.
        NSCameraUsageDescription: Takes photos of meals, labels and workouts.
        NSPhotoLibraryUsageDescription: Picks photos of meals, labels and workouts.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ie.hyroxlab.lumagallery
        PRODUCT_NAME: LumaGallery
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  LumaGallery:
    build:
      targets:
        LumaGallery: all
    run:
      config: Debug
